name: Sito URBIOS su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:patient
      - run: npx vite build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # Sito: pagina di scelta alla radice, app paziente in paziente/, programma del medico in professionista/
      - run: |
          mkdir -p _site/paziente _site/professionista
          cp site/index.html _site/index.html
          cp -r dist-patient/. _site/paziente/
          cp _site/paziente/patient.html _site/paziente/index.html
          cp dist/index.html _site/professionista/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
