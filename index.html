<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<title>URBIOS</title>
<style>
:root{--bg:#0B0C0E;--ink:#fff;--muted:#9AA0AE;--lime:#D8FD38}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1{margin:0;font-size:15px;letter-spacing:.5em;font-weight:700;text-indent:.5em}
p{margin:6px 0 0;text-align:center;color:var(--muted);font-size:15px}
.box{display:flex;flex-direction:column;gap:14px;width:min(420px,100%)}
a{display:flex;align-items:center;gap:16px;min-height:96px;padding:0 24px;border-radius:32px;text-decoration:none;font-size:20px;font-weight:700;background:#17181C;color:var(--ink);border:1px solid #26282F}
a small{display:block;margin-top:3px;font-size:14px;font-weight:500;color:var(--muted)}
a.p{background:var(--lime);color:var(--bg);border-color:var(--lime)} a.p small{color:#3a4410}
a svg{flex:none;width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a span{flex:1} a .go{width:22px;height:22px}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div><h1>URBIOS</h1><p>Piattaforma per professionisti della salute</p></div>
<div class="box">
<a href="paziente/patient.html" class="p"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Sono un paziente<small>Apri la mia app</small></span><svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
<a href="professionista/"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Sono un professionista<small>Apri il programma</small></span><svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
</div>
</body>
</html>
