<!doctype html><meta charset="utf-8"><title>Prova su acquisizioni diverse</title>
<body style="margin:0;background:#111;color:#bbb;font:12px system-ui"><div id="g" style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px"></div>
<script type="module">
import {enhance} from './gel-enhance.js';
const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='gel.jpg'});
const W=700,H=Math.round(im.height*W/im.width);
const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
const base=new Float32Array(W*H);for(let i=0;i<base.length;i++)base[i]=d[i*4];
const rnd=(()=>{let s=7;return()=>{s=(s*16807)%2147483647;return s/2147483647}})();const gauss=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.283*rnd());
const variants=[
 ['originale',base,W,H],
 ['inversa (bande scure su fondo chiaro)',base.map(v=>255-v),W,H],
 ['sottoesposta (×0,3)',base.map(v=>v*.3),W,H],
 ['rumorosa (σ=9)',base.map(v=>Math.min(255,Math.max(0,v+9*gauss()))),W,H],
 ['poco contrasto (×0,45 +70)',base.map(v=>v*.45+70),W,H],
 ['corsie orizzontali (ruotata 90°)',(()=>{const o=new Float32Array(W*H);for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++)o[xx*H+y]=base[y*W+xx];return o})(),H,W],
];
const show=(arr,w,h,label)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');const id=cx.createImageData(w,h);for(let i=0;i<arr.length;i++){const v=arr[i];id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255}cx.putImageData(id,0,0);cv.style.cssText='width:100%;display:block';const dv=document.createElement('div');dv.innerHTML=label;dv.appendChild(cv);document.getElementById('g').appendChild(dv)};
const res=[];
for(const [n,a,w,h] of variants){const t=performance.now();const {out,info}=enhance(a,w,h);res.push([n,info,Math.round(performance.now()-t)]);show(a,w,h,n+' — acquisizione');show(out,w,h,n+' — risultato')}
window.__res=res;
</script>
