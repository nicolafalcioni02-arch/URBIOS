<!doctype html><meta charset="utf-8"><title>Prova algoritmo gel</title>
<body style="margin:0;background:#000;color:#bbb;font:12px system-ui">
<canvas id="c" style="display:block;width:100vw" title="clic = originale / risultato"></canvas>
<script type="module">
const lineExt=(src,dst,w,h,r,vert,isMax)=>{const len=vert?h:w,lines=vert?w:h,q=new Int32Array(len+1);for(let l=0;l<lines;l++){const at=i=>vert?i*w+l:l*w+i;let hd=0,tl=0;for(let i=0;i<len+r;i++){if(i<len){const v=src[at(i)];while(tl>hd&&(isMax?src[at(q[tl-1])]<=v:src[at(q[tl-1])]>=v))tl--;q[tl++]=i}const c=i-r;if(c>=0){while(q[hd]<c-r)hd++;dst[at(c)]=src[at(q[hd])]}}}};
const ext=(a,w,h,rx,ry,mx)=>{let o=a;if(rx>0){const t=new Float32Array(a.length);lineExt(o,t,w,h,rx,false,mx);o=t}if(ry>0){const t=new Float32Array(a.length);lineExt(o,t,w,h,ry,true,mx);o=t}return o};
const opening=(a,w,h,rx,ry)=>ext(ext(a,w,h,rx,ry,false),w,h,rx,ry,true);
const halo=(Y,w,h,frac)=>{const sp=Math.max(2,Math.round(Math.max(w,h)/380));const a=opening(Y,w,h,sp,sp);const L=Math.max(8,Math.round(h*frac));return ext(ext(a,w,h,0,L,false),w,h,0,L,true)};
const blur=(a,w,h,rx,ry)=>{const pass=(src,len,lines,step,lstep,r)=>{const o=new Float32Array(src.length);for(let l=0;l<lines;l++){const b=l*lstep;let sum=0;for(let i=-r;i<=r;i++)sum+=src[b+Math.min(len-1,Math.max(0,i))*step];for(let i=0;i<len;i++){o[b+i*step]=sum/(2*r+1);sum+=src[b+Math.min(len-1,i+r+1)*step]-src[b+Math.max(0,i-r)*step]}}return o};return pass(pass(a,w,h,1,w,rx),h,w,w,1,ry)};
const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='gel.jpg'});
const W=1400,H=Math.round(im.height*W/im.width);const c=document.getElementById('c');c.width=W;c.height=H;const x=c.getContext('2d');
x.drawImage(im,0,0,W,H);const src=x.getImageData(0,0,W,H);const Y=new Float32Array(W*H);for(let i=0;i<Y.length;i++)Y[i]=src.data[i*4];
// Ogni pixel viene rivalutato rispetto al suo intorno (contrasto locale in scala logaritmica): niente maschere, niente forme disegnate.
//  - puntino: se è molto più chiaro dei vicini si riporta al livello dei vicini (soglia graduale)
//  - alone/fondo: l'intorno ampio (con la luce delle bande forti limitata, così non scava buchi) viene tolto in parte
//  - banda: ciò che sta sopra l'intorno emerge, anche se sta appoggiato sulla coda di una banda forte
let orig=false;
const sstep=(a,b,v)=>{const t=Math.min(1,Math.max(0,(v-a)/(b-a)));return t*t*(3-2*t)};
const draw=()=>{const out=x.createImageData(W,H);const N=W*H;
 if(orig){out.data.set(src.data);x.putImageData(out,0,0);return}
 const sp=Math.max(3,Math.round(W/260));const Yd=opening(Y,W,H,sp,sp);
 const Y1=new Float32Array(N);for(let i=0;i<N;i++){const w=sstep(4,16,Y[i]-Yd[i]);Y1[i]=Y[i]+(Yd[i]-Y[i])*w}
 const Ysm=blur(blur(Y1,W,H,1,1),W,H,1,1);const E=8;const Lg=new Float32Array(N),Ls=new Float32Array(N);for(let i=0;i<N;i++){Lg[i]=Math.log(Ysm[i]+E);Ls[i]=Math.log(Math.min(Y1[i],110)+E)}
 let Lb=blur(Ls,W,H,Math.round(W*.014),Math.round(H*.04));Lb=blur(Lb,W,H,Math.round(W*.01),Math.round(H*.03));
 const R=new Float32Array(N);for(let i=0;i<N;i++)R[i]=Lg[i]-0.4*Lb[i];
 const s=[];for(let i=0;i<N;i+=37)s.push(R[i]);s.sort((a,b)=>a-b);const lo=s[Math.floor(s.length*.45)],hi=s[Math.floor(s.length*.9995)];
 for(let i=0;i<N;i++){const t=Math.min(1,Math.max(0,(R[i]-lo)/(hi-lo)));const v=255*Math.pow(t,.8);out.data[i*4]=out.data[i*4+1]=out.data[i*4+2]=v;out.data[i*4+3]=255}
 x.putImageData(out,0,0)};
c.onclick=()=>{orig=!orig;draw()};draw();
</script>
