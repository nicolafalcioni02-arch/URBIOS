<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
import {enhanceFaithful as enhance} from './gel-enhance-fedele.js';
const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='gel.jpg'});
const W=im.width,H=im.height;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0);
const d=x.getImageData(0,0,W,H);const g=new Float32Array(W*H);for(let i=0;i<g.length;i++)g[i]=d.data[i*4];
const {out,info}=enhance(g,W,H);window.__info=info;
for(let i=0;i<out.length;i++){const v=out[i];d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;d.data[i*4+3]=255}
x.putImageData(d,0,0);c.style.cssText='width:100vw;display:block';document.body.appendChild(c);
const blob=await new Promise(r=>c.toBlob(r,'image/png'));
window.__sent=await fetch('http://127.0.0.1:8765/',{method:'POST',body:blob}).then(r=>r.text()).catch(e=>String(e));
</script>
