<!doctype html><meta charset="utf-8"><title>Prova algoritmo gel</title>
<body style="margin:0;background:#000">
<canvas id="c" style="display:block;width:100vw" title="clic = originale / risultato"></canvas>
<script type="module">
// minimo/massimo mobile 1D (coda monotona) su righe o colonne
const lineExt=(src,dst,w,h,r,vert,isMax)=>{
  const len=vert?h:w,lines=vert?w:h,q=new Int32Array(len+1);
  for(let l=0;l<lines;l++){
    const at=i=>vert?i*w+l:l*w+i;
    let hd=0,tl=0;
    for(let i=0;i<len+r;i++){
      if(i<len){
        const v=src[at(i)];
        while(tl>hd&&(isMax?src[at(q[tl-1])]<=v:src[at(q[tl-1])]>=v))tl--;
        q[tl++]=i;
      }
      const c=i-r;
      if(c>=0){
        while(q[hd]<c-r)hd++;
        dst[at(c)]=src[at(q[hd])];
      }
    }
  }
};
const ext=(a,w,h,rx,ry,mx)=>{
  let o=a;
  if(rx>0){const t=new Float32Array(a.length);lineExt(o,t,w,h,rx,false,mx);o=t}
  if(ry>0){const t=new Float32Array(a.length);lineExt(o,t,w,h,ry,true,mx);o=t}
  return o;
};
const opening=(a,w,h,rx,ry)=>ext(ext(a,w,h,rx,ry,false),w,h,rx,ry,true);
// sfocatura a scatola separabile
const blur=(a,w,h,rx,ry)=>{
  const pass=(src,len,lines,step,lstep,r)=>{
    const o=new Float32Array(src.length);
    for(let l=0;l<lines;l++){
      const b=l*lstep;let sum=0;
      for(let i=-r;i<=r;i++)sum+=src[b+Math.min(len-1,Math.max(0,i))*step];
      for(let i=0;i<len;i++){
        o[b+i*step]=sum/(2*r+1);
        sum+=src[b+Math.min(len-1,i+r+1)*step]-src[b+Math.max(0,i-r)*step];
      }
    }
    return o;
  };
  return pass(pass(a,w,h,1,w,rx),h,w,w,1,ry);
};

const im=await new Promise(r=>{
  const i=new Image();i.onload=()=>r(i);i.src='gel.jpg';
});
const W=1400,H=Math.round(im.height*W/im.width);
const c=document.getElementById('c');
c.width=W;c.height=H;
const x=c.getContext('2d');
x.drawImage(im,0,0,W,H);
const src=x.getImageData(0,0,W,H);
const N=W*H;
const Y=new Float32Array(N);
for(let i=0;i<N;i++)Y[i]=src.data[i*4];

// === STIMA PARAMETRI ADATTIVI (dall'immagine) ===
const samp=[];
for(let i=0;i<N;i+=53)samp.push(Y[i]);
samp.sort((a,b)=>a-b);
const capV=samp[Math.floor(samp.length*0.98)];

const diffs=[];
for(let y=2;y<H-2;y+=5)for(let xx=2;xx<W-2;xx+=5){
  const cc=Y[y*W+xx];
  const m=(Y[(y-1)*W+xx]+Y[(y+1)*W+xx]+Y[y*W+xx-1]+Y[y*W+xx+1])*0.25;
  diffs.push(Math.abs(cc-m));
}
diffs.sort((a,b)=>a-b);
const noise=Math.max(0.5,diffs[diffs.length>>1]);

let orig=false;
const sstep=(a,b,v)=>{
  const t=Math.min(1,Math.max(0,(v-a)/(b-a)));
  return t*t*(3-2*t);
};

// Tutti i parametri sono ricavati dall'immagine stessa (niente costanti da regolare a mano):
//  rumore  = mediana delle differenze coi vicini
//  fondo   = moda dell'istogramma
//  luci    = 99° percentile
//  spessore delle bande forti = pixel sopra la soglia di metà / colonne che ne hanno
// Poi: (1) toglie l'alone delle bande forti nella misura massima che non scende sotto il fondo,
//      (2) nero = fondo + 2 rumori, (3) gamma scelta perché la mediana del segnale cada a metà scala.
const hist=new Float64Array(256);for(let i=0;i<N;i++)hist[Y[i]|0]++;
const sh=new Float64Array(256);for(let v=0;v<256;v++){let a=0,n=0;for(let k=-2;k<=2;k++){if(v+k>=0&&v+k<256){a+=hist[v+k];n++}}sh[v]=a/n}
let BG=0;for(let v=1;v<200;v++)if(sh[v]>sh[BG])BG=v;                          // moda = fondo
const srt=Float32Array.from(Y).sort();const WHITE=srt[Math.floor(N*.995)];
const nz=[];for(let y=2;y<H-2;y+=4)for(let xx=2;xx<W-2;xx+=4){const i=y*W+xx;nz.push(Math.abs(Y[i]-(Y[i-1]+Y[i+1]+Y[i-W]+Y[i+W])*.25))}nz.sort((a,b)=>a-b);const SIGMA=Math.max(.5,nz[nz.length>>1]);
const T=(BG+WHITE)/2;                                                           // soglia "banda forte" = metà tra fondo e luci
let cnt=0;const colHas=new Uint8Array(W);for(let i=0;i<N;i++)if(Y[i]>T){cnt++;colHas[i%W]=1}
let cols=0;for(let xx=0;xx<W;xx++)cols+=colHas[xx];const THICK=Math.max(4,cnt/Math.max(1,cols));   // spessore medio delle bande forti
const S=new Float32Array(N);for(let i=0;i<N;i++)S[i]=Math.max(0,Y[i]-T);
let G=blur(S,W,H,Math.round(THICK*.6),Math.round(THICK*1.6));G=blur(G,W,H,Math.round(THICK*.4),Math.round(THICK*1.2));
// coefficiente: il più grande per cui nessun pixel dell'alone scende sotto il fondo (2° percentile del rapporto)
const rr=[];for(let i=0;i<N;i+=7)if(G[i]>3*SIGMA)rr.push(Math.max(0,(Y[i]-BG))/G[i]);rr.sort((a,b)=>a-b);
const K=rr.length?Math.min(1.5,rr[Math.floor(rr.length*.02)]):0;
const Yc=new Float32Array(N);for(let i=0;i<N;i++)Yc[i]=Math.max(0,Y[i]-G[i]*K);
const LO=BG+2*SIGMA;
const sig=[];for(let i=0;i<N;i+=13)if(Yc[i]>LO+6*SIGMA)sig.push((Yc[i]-LO)/(255-LO));
const tm=sig.length?sig.reduce((a,b)=>a+b)/sig.length:.5;const GAMMA=Math.min(1,Math.max(.5,Math.log(.4)/Math.log(Math.max(.02,tm))));   // il segnale medio cade al 40% della scala
window.__par={BG,WHITE,SIGMA,T,THICK,K,LO,GAMMA};
const draw=()=>{const out=x.createImageData(W,H);
 if(orig){out.data.set(src.data);x.putImageData(out,0,0);return}
 const lut=new Float32Array(256);for(let v=0;v<256;v++){const t=Math.min(1,Math.max(0,(v-LO)/(255-LO)));lut[v]=255*Math.pow(t,GAMMA)}
 for(let i=0;i<N;i++){const v=lut[Yc[i]|0];out.data[i*4]=out.data[i*4+1]=out.data[i*4+2]=v;out.data[i*4+3]=255}
 x.putImageData(out,0,0)};
c.onclick=()=>{orig=!orig;draw()};
draw();
</script>
